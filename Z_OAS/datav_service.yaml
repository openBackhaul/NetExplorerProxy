  /v1/provide-nep-data-statistics:
    post:
      operationId: provideNepDataStatistics
      summary: 'Provides (non-MAC) data availability statistics of the NEP cache for the current day'
      tags:
        - IndividualServices
      security:
        - apiKeyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                target-date:
                  type: string
                  enum:
                    - 'today'
                    - 'yesterday'
                  description: > 
                    'Data statistics are provided according to the selected day. If no requestBody is provided (optional), the default=today is applied.'
      responses:
        '200':
          description: 'NEP data statistics provided'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data-statistics
                properties:
                  data-statistics:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        description: > 
                          'If the service was called with a request body, then 
                          if {request.body#target-date} == yesterday, then timestamp contains the date from yesterday (yyyy-mm-dd format),
                          else if {request.body#target-date} == today, or if requestBody not provided at all then the timestamp contains the current date (yyyy-mm-ddThh:mm:ss+offsetHours:offsetMinutes)'
                      number-of-connected-devices:
                        type: integer
                        description: >
                          'The number of currently connected devices at MWDI
                          from count of entries in {$PromptForProvidingNepDataStaticsticsCausesReadingFromNepCache.GetConnectedDevices.response.body#mount-name-list}'
                      number-of-devices-in-nep-cache:
                        type: integer
                        description: >
                          'The number of devices in the NEP cache
                          from count of all entries in {$PromptForProvidingNepDataStaticsticsCausesReadingFromNepCache.GetListOfNepDevices.response.body#mount-name-list/mount-name}'
                      number-of-recently-update-devices-in-nep-cache:
                        type: integer
                        description: >
                          'The number of recently updated devices in the NEP cache
                          from count of all entries in {PromptForProvidingNepDataStaticsticsCausesReadingFromNepCache.GetListOfNepDevices.response.body#mount-name-list/mount-name}
                          where {$PromptForProvidingNepDataStaticsticsCausesReadingFromNepCache.GetListOfNepDevices.response.body#mount-name-list/last-data-update-timestamp} contains the current day'
                      number-of-records-per-data-class:
                        type: object
                        properties:
                          general-device-info:
                            type: integer
                            description: >
                              'The number of records for generalInformationOfDevices with timestamp containing the day according to {response.body#data-statistics/timestamp}' 
                              from ElasticSearch callback {$PromptForProvidingNepDataStaticsticsCausesReadingFromNepCache.GetNepDataStatistics}'
                          actual-equipment-info:
                            type: integer
                            description: >
                              'The number of records for actualEquipmentInformation with timestamp containing the day according to {response.body#data-statistics/timestamp}' 
                              from ElasticSearch callback {$PromptForProvidingNepDataStaticsticsCausesReadingFromNepCache.GetNepDataStatistics}'
                          air-interface-general-info:
                            type: integer
                            description: >
                              'The number of records for airInterfaceGeneralInformation with timestamp containing the day according to {response.body#data-statistics/timestamp}' 
                              from ElasticSearch callback {$PromptForProvidingNepDataStaticsticsCausesReadingFromNepCache.GetNepDataStatistics}'
                          air-interface-transmission-mode-lists:
                            type: integer
                            description: >
                              'The number of records for airInterfaceTransmissionModeLists with timestamp containing the day according to {response.body#data-statistics/timestamp}' 
                              from ElasticSearch callback {$PromptForProvidingNepDataStaticsticsCausesReadingFromNepCache.GetNepDataStatistics}'
                          air-interface-non-qam-pm-data:
                            type: integer
                            description: >
                              'The number of records for airInterfaceNonQamPmData with timestamp containing the day according to {response.body#data-statistics/timestamp}' 
                              from ElasticSearch callback {$PromptForProvidingNepDataStaticsticsCausesReadingFromNepCache.GetNepDataStatistics}'
                          air-interface-qam-pm-data:
                            type: integer
                            description: >
                              'The number of records for airInterfaceQamPmData with timestamp containing the day according to {response.body#data-statistics/timestamp}' 
                              from ElasticSearch callback {$PromptForProvidingNepDataStaticsticsCausesReadingFromNepCache.GetNepDataStatistics}'
                          ethernet-container-general-info:
                            type: integer
                            description: >
                              'The number of records for ethernetContainerGeneralInformation with timestamp containing the day according to {response.body#data-statistics/timestamp}' 
                              from ElasticSearch callback {$PromptForProvidingNepDataStaticsticsCausesReadingFromNepCache.GetNepDataStatistics}'
                          ethernet-container-pm-data:
                            type: integer
                            description: >
                              'The number of records for ethernetContainerPmData with timestamp containing the day according to {response.body#data-statistics/timestamp}' 
                              from ElasticSearch callback {$PromptForProvidingNepDataStaticsticsCausesReadingFromNepCache.GetNepDataStatistics}'
                          wire-interface-general-info:
                            type: integer
                            description: >
                              'The number of records for wireInterfaceGeneralInformation with timestamp containing the day according to {response.body#data-statistics/timestamp}' 
                              from ElasticSearch callback {$PromptForProvidingNepDataStaticsticsCausesReadingFromNepCache.GetNepDataStatistics}'
              example:
                data-statistics:
                  timestamp: '2025-01-01T03:27:00+01:02'
                  number-of-connected-devices: 37500
                  number-of-devices-in-nep-cache: 40000
                  number-of-recently-update-devices-in-nep-cache: 18000
                  number-of-records-per-data-class:
                    general-device-info: 10000
                    actual-equipment-info: 25000
                    air-interface-general-info: 20000
                    air-interface-transmission-mode-lists: 29000
                    air-interface-non-qam-pm-data: 90000
                    air-interface-qam-pm-data: 180000
                    ethernet-container-general-info: 50000
                    ethernet-container-pm-data: 150000
                    wire-interface-general-info: 30000
          headers:
            life-cycle-state:
              schema:
                type: string
                enum:
                  - 'EXPERIMENTAL'
                  - 'OPERATIONAL'
                  - 'DEPRECATED'
                  - 'OBSOLETE'
                  - 'UNKNOWN'
                  - 'NOT_YET_DEFINED'
                example: 'EXPERIMENTAL'
              description: >
                'Life cycle state of the consumed service
                find in [/core-model-1-4:control-construct/logical-termination-point=nep-1-1-0-op-s-is-020/layer-protocol=0/operation-server-interface-1-0:operation-server-interface-pac/operation-server-interface-configuration/life-cycle-state]'
        '400':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '401':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '403':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '404':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '500':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '502':
          $ref: '#/components/responses/502'
        '531':
          $ref: '#/components/responses/531'
        '532':
          $ref: '#/components/responses/532'
        default:
          $ref: '#/components/responses/responseForErroredServiceRequests'
      callbacks:
        PromptForProvidingNepDataStaticsticsCausesReadingFromNepCache:
        # ANPASSEN
          GetConnectedDevices: #[/core-model-1-4:control-construct/logical-termination-point=nep-1-1-0-tcp-c-mwdi-1-1-2-000/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac/tcp-client-interface-configuration/remote-protocol]://[/core-model-1-4:control-construct/logical-termination-point=nep-1-1-0-tcp-c-mwdi-1-1-2-000/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac/tcp-client-interface-configuration/remote-address/domain-name or /core-model-1-4:control-construct/logical-termination-point=nep-1-1-0-tcp-c-mwdi-1-1-2-000/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac/tcp-client-interface-configuration/remote-address/ip-address/ipv-4-address]:[/core-model-1-4:control-construct/logical-termination-point=nep-1-1-0-tcp-c-mwdi-1-1-2-000/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac/tcp-client-interface-configuration/remote-port][/core-model-1-4:control-construct/logical-termination-point=nep-1-1-0-op-c-is-mwdi-1-1-2-000/layer-protocol=0/operation-client-interface-1-0:operation-client-interface-pac/operation-client-interface-configuration/operation-name]
            post:
              parameters:
                - $ref: '#/components/parameters/user'
                - $ref: '#/components/parameters/originator'
                - $ref: '#/components/parameters/x-correlator'
                - $ref: '#/components/parameters/trace-indicator'
                - $ref: '#/components/parameters/customer-journey'
              responses:
                '200':
                  description: 'List of connected devices provided'
                  content:
                    application/json:
                      schema:
                        type: object
                        required:
                          - mount-name-list
                        properties:
                          mount-name-list:
                            type: array
                            items:
                              type: string
                              description: 'MountName of device in connected state at the Controller'
                      example:
                        mount-name-list:
                          - '305251234'
                          - '105258888'
                  headers:
                    x-correlator:
                      schema:
                        type: string
                        example: '550e8400-e29b-11d4-a716-446655440000'
                      description: 'UUID for the service execution flow that allows to correlate requests and responses. Its value must be identical at the response compared with its corresponding request'
                    exec-time:
                      schema:
                        type: integer
                        example: 1100
                      description: 'Value written by the service provider, reporting the total elapsed time for the execution, including all the additional processing needed to retrieve the data from the backend service. Expressed in milliseconds'
                    backend-time:
                      schema:
                        type: integer
                        example: 850
                      description: 'Value written by the service provider, reporting the elapsed time for data retrieval from the backend (service invocation, database access…). Expressed in milliseconds'
                    life-cycle-state:
                      schema:
                        type: string
                        enum:
                          - 'EXPERIMENTAL'
                          - 'OPERATIONAL'
                          - 'DEPRECATED'
                          - 'OBSOLETE'
                          - 'UNKNOWN'
                          - 'NOT_YET_DEFINED'
                        example: 'EXPERIMENTAL'
                      description: 'Life cycle state of the consumed service'
                '400':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '401':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '403':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '404':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '500':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '502':
                  $ref: '#/components/responses/502'
                '531':
                  $ref: '#/components/responses/531'
                '532':
                  $ref: '#/components/responses/532'
                default:
                  $ref: '#/components/responses/responseForErroredServiceRequests'
              GetListOfNepDevices:
                #todo
              #GetNepDataStatistics: geht auch ElasticSearch - entfällt
              