# Ideen für services
# bei jeder csv Ausgabe auch einen Header!

# per default sollen die Daten für alle Geräte ausgegeben werden,
  # optional kann als input parameter eine Liste von devices angegeben werden?
# 1.) Air Interface data
# (A)
/v1/provide-air-interface-non-pm-data-of-devices



- allgemeine infos:
  - mount-name
  - uuid, operational-state, local-id
- config:
  - transmission-mode-min
  - transmission-mode-max
  - transmitter-is-on
  - xpic-is-on
  - power-is-on
- status:
  - up/down/testing/unknown/dormant/not-present/not-yet-defined (remove the "air-interface-2-0:INTERFACE_STATUS_TYPE" substring)
- administrative-state
- ltp-augment-pac:original-ltp-name

- capability:
  - type-of-equipment

- außerdem: timestamp von wann die Daten sind

#-----------
# (B) QAM Info für capa berechnung
/v1/provide-air-interface-transmission-mode-list-of-devices

# hier auch 
- mount-name, timestamp, uuid, local-id (für's mapping), ggf. einen counter pro transmission-mode-list- Eintrag des devices (seqNum, starts with 0 for each new Interface)
- tranmission-mode-list: jedes Record als 1 Zeile darstellen
  - transmission-mode-name;symbol-rate-reduction-factor;channel-bandwidth;xpic-is-avail;modulation-scheme-name-at-lct;modulation-scheme;code-rate


#-------------------------
# (C.1) PM Daten
/v1/provide-air-interface-historical-non-qam-data-of-devices
- mount-name, uuid, local-id, period-end-time
- es, ses, ut, rx-level-min, rx-level-max, rx-level-avg, tx-level-min, tx-level-max, tx-level-avg
- xpd-min, xpd-max, xpd-avg, snir-min, snir-max, snir-avg

# (C.2)
/v1/provide-air-interface-historical-qam-data-of-devices
# 1 Zeile pro time-xstates-list entry (wo time>0)
- mount-name, uuid, local-id, period-end-time, transmission-mode, time