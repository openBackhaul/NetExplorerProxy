  /v1/provide-ethernet-container-pm-data-of-devices:
    post:
      operationId: provideEthernetContainerGeneralInformationOfDevices
      summary: 'Responses with ethernetContainer PM data for all (target) devices in the NetExplorerProxy cache.'
      tags:
        - IndividualServices
      security:
        - basicAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mount-name-list:
                  type: array
                  items:
                    type: string
                    description: 'Optional list of device names the reponse data shall be filtered for'
              example:
                mount-name-list: 
                  - '305251234'
                  - '100250001'
      responses:
        '200':
          description: 'ethernetContainer PM data for all (target) devices in the NetExplorerProxy cache in csv format.'
          content:
            text/csv:
              schema:
                type: string
                description: >
                  'The first line shall contain the following headers:
                    mount-name;uuid;local-id;period-end-time;total-bytes-input;total-bytes-output;total-frames-input;total-frames-output;errored-frames-input;errored-frames-output;dropped-frames-input;dropped-frames-output
                  There shall be a single line containing all relevant data per device, ethernetContainer and time interval (missing information is to be left blank)
                  from the cache/ElasticSearch (ethernetContainerPm)'
              example:
                mount-name;uuid;local-id;period-end-time;total-bytes-input;total-bytes-output;total-frames-input;total-frames-output;errored-frames-input;errored-frames-output;dropped-frames-input;dropped-frames-output
                100250001;ETH-2134639490;2134639490;2024-12-10T08:30:00+01:00;74054;17333;-1;-1;899;0;0;0
                100250001;ETH-2134639490;2134639490;2024-12-10T07:45:00+01:00;73444;16016;-1;-1;899;0;0;0
          headers:
            life-cycle-state:
              schema:
                type: string
                enum:
                  - 'EXPERIMENTAL'
                  - 'OPERATIONAL'
                  - 'DEPRECATED'
                  - 'OBSOLETE'
                  - 'UNKNOWN'
                  - 'NOT_YET_DEFINED'
                example: 'EXPERIMENTAL'
              description: >
                'Life cycle state of the consumed service
                find in [/core-model-1-4:control-construct/logical-termination-point=nep-1-1-0-op-s-is-041/layer-protocol=0/operation-server-interface-1-0:operation-server-interface-pac/operation-server-interface-configuration/life-cycle-state]'
        '400':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '401':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '403':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '404':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '500':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '502':
          $ref: '#/components/responses/502'
        '531':
          $ref: '#/components/responses/531'
        '532':
          $ref: '#/components/responses/532'
        default:
          $ref: '#/components/responses/responseForErroredServiceRequests'