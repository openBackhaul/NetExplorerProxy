  /v1/provide-air-interface-general-information-of-devices:
    post:
      operationId: provideAirInterfaceGeneralInformationOfDevices
      summary: 'Responses with general air interface information for all (target) devices in the NetExplorerProxy cache.'
      tags:
        - IndividualServices
      security:
        - basicAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mount-name-list:
                  type: array
                  items:
                    type: string
                    description: 'Optional list of device names the reponse data shall be filtered for'
              example:
                mount-name-list: 
                  - '305251234'
                  - '100250001'
      responses:
        '200':
          description: 'General air interface information for all (target) devices in the NetExplorerProxy cache in csv format.'
          content:
            text/csv:
              schema:
                type: string
                description: >
                  'The first line shall contain the following headers:
                    mount-name;uuid;operational-state;local-id;timestamp;administrative-state;original-ltp-name;transmission-mode-min;transmission-mode-max;xpic-is-on;power-is-on;transmitter-is-on;interface-status;type-of-equipment
                  There shall be a single line containing all relevant data per device and air interface (missing information is to be left blank)
                  from the cache/ElasticSearch (airInterfaceGeneralInfo)'
              example:
                mount-name;uuid;operational-state;local-id;timestamp;administrative-state;original-ltp-name;transmission-mode-min;transmission-mode-max;xpic-is-on;power-is-on;transmitter-is-on;interface-status;type-of-equipment
                100250001;RF-123456789;core-model-1-4:OPERATIONAL_STATE_ENABLED;123456789;2024-12-11T16:00:00+01:00;UNLOCKED;RF 1/2.1/1;56000-16-v0;56000-256-v0;false;true;true;UP;RAU2 X 32/13 R3A
                100250001;RF-234234234;core-model-1-4:OPERATIONAL_STATE_ENABLED;234234234;2024-12-11T16:00:00+01:00;UNLOCKED;RF 1/3.1/1;56000-16-v0;56000-1024-v0;false;true;true;UP;RAU2 X 32/13 R3A
                200250003;ltpB-1;core-model-1-4:OPERATIONAL_STATE_ENABLED;ltpB-1-localId-1;2024-12-11T16:07:00+01:00;UNLOCKED;RF 1/5.1/1;4QAM;2048QAM;false;true;true;UP;RAU2 X 32/13 R3A
          headers:
            life-cycle-state:
              schema:
                type: string
                enum:
                  - 'EXPERIMENTAL'
                  - 'OPERATIONAL'
                  - 'DEPRECATED'
                  - 'OBSOLETE'
                  - 'UNKNOWN'
                  - 'NOT_YET_DEFINED'
                example: 'EXPERIMENTAL'
              description: >
                'Life cycle state of the consumed service
                find in [/core-model-1-4:control-construct/logical-termination-point=nep-1-1-0-op-s-is-030/layer-protocol=0/operation-server-interface-1-0:operation-server-interface-pac/operation-server-interface-configuration/life-cycle-state]'
        '400':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '401':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '403':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '404':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '500':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '502':
          $ref: '#/components/responses/502'
        '531':
          $ref: '#/components/responses/531'
        '532':
          $ref: '#/components/responses/532'
        default:
          $ref: '#/components/responses/responseForErroredServiceRequests'