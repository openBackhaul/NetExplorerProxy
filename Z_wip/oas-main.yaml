                        from {PromptForProvidingAllMacTablesCausesReadingMacTablesFromMatrCache.response.body#own-mac-address}'
                    egress-ltp-uuid:
                      type: string
                      description: >
                        'UUID of the MacInterface towards the listed remote MAC addresses
                        from {PromptForProvidingAllMacTablesCausesReadingMacTablesFromMatrCache.response.body#egress-ltp-uuid}'
                    original-ltp-name:
                      type: string
                      description: >
                        'Name of the egress interface as it is represented on the Local Craft Terminal provided by the vendor
