      callbacks:
        RequestForReceivingCurrentMacTableOfDeviceCausesSendingAnswerToRequestor:
          url: #[{lookupTable(requestId)#requestor-protocol}]://[{lookupTable(requestId)#requestor-ipv-4-address}]:[{lookupTable(requestId)#requestor-port}][{lookupTable(requestId)#requestor-receive-operation}]
            post:
              parameters:
