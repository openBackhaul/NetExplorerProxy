  /v1/provide-nep-data-statistics:
    post:
      operationId: provideNepDataStatistics
      summary: 'Provides (non-MAC) data availability statistics of the NEP cache for the current day'
      tags:
        - IndividualServices
      security:
        - apiKeyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                target-date:
                  type: string
                  enum:
                    - 'today'
                    - 'yesterday'
      responses:
        '200':
          description: 'NEP data statistics provided'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data-statistics
                properties:
                  data-statistics:
                    type: object
                    properties:
                      timestamp:
                        type: string
                      number-of-connected-devices:
                        type: integer
                      number-of-devices-in-nep-cache:
                        type: integer
                      number-of-recently-update-devices-in-nep-cache:
                        type: integer
                      number-of-records-per-data-class:
                        type: object
                        properties:
                          general-device-info:
                            type: integer
                          actual-equipment-info:
                            type: integer
                          air-interface-general-info:
                            type: integer
                          air-interface-transmission-mode-lists:
                            type: integer
                          air-interface-non-qam-pm-data:
                            type: integer
                          air-interface-qam-pm-data:
                            type: integer
                          ethernet-container-general-info:
                            type: integer
                          ethernet-container-pm-data:
                            type: integer
                          wire-interface-general-info:
                            type: integer
              example:
                data-statistics:
                  timestamp: '2025-01-01T03:27:00+01:02'
                  number-of-connected-devices: 37500
                  number-of-devices-in-nep-cache: 40000
                  number-of-recently-update-devices-in-nep-cache: 18000
                  number-of-records-per-data-class:
                    general-device-info: 10000
                    actual-equipment-info: 25000
                    air-interface-general-info: 20000
                    air-interface-transmission-mode-lists: 29000
                    air-interface-non-qam-pm-data: 90000
                    air-interface-qam-pm-data: 180000
                    ethernet-container-general-info: 50000
                    ethernet-container-pm-data: 150000
                    wire-interface-general-info: 30000
          headers:
            life-cycle-state:
              schema:
                type: string
                enum:
                  - 'EXPERIMENTAL'
                  - 'OPERATIONAL'
                  - 'DEPRECATED'
                  - 'OBSOLETE'
                  - 'UNKNOWN'
                  - 'NOT_YET_DEFINED'
                example: 'EXPERIMENTAL'
              description: >
                'Life cycle state of the consumed service
                find in [/core-model-1-4:control-construct/logical-termination-point=nep-1-1-0-op-s-is-020/layer-protocol=0/operation-server-interface-1-0:operation-server-interface-pac/operation-server-interface-configuration/life-cycle-state]'
        '400':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '401':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '403':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '404':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '500':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '502':
          $ref: '#/components/responses/502'
        '531':
          $ref: '#/components/responses/531'
        '532':
          $ref: '#/components/responses/532'
        default:
          $ref: '#/components/responses/responseForErroredServiceRequests'