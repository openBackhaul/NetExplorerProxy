
  /v1/provide-mac-table-of-all-devices:
    type: array
    items:
      type: object
      required:
        - mount-name
        - own-mac-address
        - egress-ltp-uuid
        - original-ltp-name
        - vlan-id
        - remote-mac-address
        - time-stamp-of-data
      properties:
        mount-name:
          type: string
        own-mac-address:
          type: string
        egress-ltp-uuid:
          type: string
        original-ltp-name:
          type: string
        vlan-id:
          type: integer
        remote-mac-address:
          type: string
        time-stamp-of-data:
          type: string
  /v1/provide-mac-table-of-specific-device:
    type: array
    items:
      type: object
      required:
        - mount-name
        - own-mac-address
        - egress-ltp-uuid
        - original-ltp-name
        - vlan-id
        - remote-mac-address
        - time-stamp-of-data
      properties:
        mount-name:
          type: string
        own-mac-address:
          type: string
        egress-ltp-uuid:
          type: string
        original-ltp-name:
          type: string
        vlan-id:
          type: integer
        remote-mac-address:
          type: string
        time-stamp-of-data:
          type: string

  /v1/read-current-mac-table-from-device:
    type: object
    required:
      - request-id
    properties:
      request-id:
        type: string

  /v1/receive-current-mac-table-of-device:

  /v1/provide-list-of-connected-devices:
    type: object
    required:
      - mount-name-list
    properties:
      mount-name-list:
        type: array
        items:
          type: string

  /v1/provide-list-of-devices-in-nep:
    type: object
    required:
      - mount-name-list
    properties:
      mount-name-list:
        type: array
        items:
          type: object
          required:
            - mount-name
            - last-data-update-timestamp
          properties:
            mount-name:
              type: string
            last-data-update-timestamp:
              type: string

  /v1/provide-general-information-of-devices:
    type: string

  /v1/provide-actual-equipment-information-of-devices:
    type: string

  /v1/provide-air-interface-general-information-of-devices:
    type: string

  /v1/provide-air-interface-transmission-mode-lists-of-devices:
    type: string

  /v1/provide-air-interface-non-qam-pm-data-of-devices:
    type: string

  /v1/provide-air-interface-qam-pm-data-of-devices:
    type: string

  /v1/provide-ethernet-container-general-information-of-devices:
    type: string

  /v1/provide-ethernet-container-pm-data-of-devices:
    type: string

  /v1/provide-wire-interface-general-information-of-devices:
    type: string
