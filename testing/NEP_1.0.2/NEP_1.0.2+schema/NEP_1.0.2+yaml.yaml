
  /v1/provide-mac-table-of-all-devices:
    type: array
    items:
      type: object
      properties:
        mount-name:
          type: string
        own-mac-address:
          type: string
        egress-ltp-uuid:
          type: string
        original-ltp-name:
          type: string
        vlan-id:
          type: integer
        remote-mac-address:
          type: string
        time-stamp-of-data:
          type: string
  /v1/provide-mac-table-of-specific-device:
    type: array
    items:
      type: object
      properties:
        mount-name:
          type: string
        own-mac-address:
          type: string
        egress-ltp-uuid:
          type: string
        original-ltp-name:
          type: string
        vlan-id:
          type: integer
        remote-mac-address:
          type: string
        time-stamp-of-data:
          type: string

  /v1/read-current-mac-table-from-device:
    type: object
    required:
      - request-id
    properties:
      request-id:
        type: string

  /v1/receive-current-mac-table-of-device:

  /v1/provide-list-of-connected-devices:
    type: object
    required:
      - mount-name-list
    properties:
      mount-name-list:
        type: array
        items:
          type: string
