
  /v1/provide-mac-table-of-all-devices:
    type: array
    items:
      type: object
      required:
        - mount-name
        - own-mac-address
        - egress-ltp-uuid
        - original-ltp-uuid
        - vlan-id
        - remote-mac-address
        - time-stamp-of-data
      properties:
        mount-name:
          type: string
        own-mac-address:
          type: string
        egress-ltp-uuid:
          type: string
        original-ltp-name:
          type: string
        vlan-id:
          type: integer
        remote-mac-address:
          type: string
        time-stamp-of-data:
          type: string
    example:
      - mount-name: '305251234'
        own-mac-address: '00:00:00:00:00:00'
        egress-ltp-uuid: '305251234+mac-inf-1234'
        original-ltp-name: 'eth-1-0-3'
        vlan-id: 17
        remote-mac-address: '01:01:01:01:01:01'
        time-stamp-of-data: '2010-11-20T14:00:00+01:00'
      - mount-name: '30525999'
        own-mac-address: 'FF:00:11:00:00:00'
        egress-ltp-uuid: '305251234+mac-inf-1234'
        original-ltp-name: 'eth-1-0-3'
        vlan-id: 17
        remote-mac-address: '01:01:01:01:01:01'
        time-stamp-of-data: '2010-11-20T14:00:00+01:00'

  /v1/provide-mac-table-of-specific-device:
    type: array
    items:
      type: object
      required:
        - mount-name
        - own-mac-address
        - egress-ltp-uuid
        - original-ltp-name
        - vlan-id
        - remote-mac-address
        - time-stamp-of-data
      properties:
        mount-name:
          type: string
        own-mac-address:
          type: string
        egress-ltp-uuid:
          type: string
        original-ltp-name:
          type: string
        vlan-id:
          type: integer
        remote-mac-address:
          type: string
        time-stamp-of-data:
          type: string
    example:
      - mount-name: '305251234'
        own-mac-address: '00:00:00:00:00:00'
        egress-ltp-uuid: '305251234+mac-inf-1234'
        original-ltp-name: 'eth-1-0-3'
        vlan-id: 17
        remote-mac-address: '01:01:01:01:01:01'
        time-stamp-of-data: '2010-11-20T14:00:00+01:00'
      - mount-name: '305251234'
        own-mac-address: '00:00:00:00:00:00'
        egress-ltp-uuid: '305251234+mac-inf-1234'
        original-ltp-name: 'eth-1-0-3'
        vlan-id: 17
        remote-mac-address: 'FF:01:01:01:01:01'
        time-stamp-of-data: '2010-11-20T14:00:00+01:00'

  /v1/read-current-mac-table-from-device:
    type: object
    required:
      - request-id
    properties:
      request-id:
        type: string
        description: 'Identifier of the request for a current MAC table'
    example:
      request-id: '305251234-101120-1400'

  /v1/receive-current-mac-table-of-device:

  /v1/provide-list-of-connected-devices:
    type: object
    required:
      - mount-name-list
    properties:
      mount-name-list:
        type: array
        items:
          type: string
    example:
      mount-name-list:
        - '305251234'
        - '105258888'

