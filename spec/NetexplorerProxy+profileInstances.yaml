  - profile-name: 'IntegerProfile'
    uuid: 'nep-1-1-0-integer-p-002'
    capability:
      integer-name: 'slidingWindowSize'
      purpose: 'Size of the sliding window for filtered ControlConstruct retrieval (i.e. parallel number of retrieval requests)'
      minimum: 1
      maximum: 5000
    configuration:
      integer-value: 50

  - profile-name: 'IntegerProfile'
    uuid: 'nep-1-1-0-integer-p-003'
    capability:
      integer-name: 'responseTimeout'
      purpose: 'Timeout for receiving the response of the filtered ControlConstruct retrieval from the MWDI'
      unit: 'second'
      minimum: 5
      maximum: 2000
    configuration:
      integer-value: 900

  - profile-name: 'IntegerProfile'
    uuid: 'nep-1-1-0-integer-p-004'
    capability:
      integer-name: 'maximumNumberOfRetries'
      purpose: 'Maximum number of retries for retrieving the filtered ControlConstruct'
      minimum: 0
      maximum: 10
    configuration:
      integer-value: 1

  - profile-name: 'IntegerProfile'
    uuid: 'nep-1-1-0-integer-p-005'
    capability:
      integer-name: 'waitingTimeBeforeRetry'
      purpose: 'The waiting time before a retry to fetch filtered ControlConstruct data'
      unit: 'minute'
      minimum: 0
      maximum: 120
    configuration:
      integer-value: 10

  - profile-name: 'IntegerProfile'
    uuid: 'nep-1-1-0-integer-p-006'
    capability:
      integer-name: 'deviceListSyncPeriod'
      purpose: 'Time period between the sync of NEP deviceList with list of connected devices from MWDI.'
      unit: 'hour'
      minimum: 1
      maximum: 72
    configuration:
      integer-value: 1

